<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>VibeGlobe: plain HTML</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b1020;
      }
      vibe-globe {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- No framework and no bundler (F481): the element's browser build, loaded as a module from static files. -->
    <vibe-globe base-imagery-url="/imagery/natural-earth-4096.jpg" center="12.5, 41.9" zoom="3"></vibe-globe>
    <script type="module">
      import { defineVibeGlobe } from '/wc/vibe-globe.js';

      const backend = new URLSearchParams(location.search).get('backend');
      const element = document.querySelector('vibe-globe');
      if (backend) element.setAttribute('backend', backend);
      const events = [];
      for (const type of ['ready', 'load', 'camera-change', 'globe-click', 'error']) {
        element.addEventListener(type, (event) => events.push({ source: 'plain', type, payload: event.detail }));
      }
      defineVibeGlobe();
      window.adapterExample = {
        events,
        globes: () => [...document.querySelectorAll('vibe-globe')].map((globe) => globe.globe),
        async show(shown) {
          if (shown && !element.isConnected) document.body.prepend(element);
          if (!shown) element.remove();
        },
        async setView(view) {
          if (view.longitudeDeg !== undefined)
            element.center = { longitudeDeg: view.longitudeDeg, latitudeDeg: view.latitudeDeg };
          if (view.zoom !== undefined) element.zoom = view.zoom;
        },
      };
    </script>
  </body>
</html>
