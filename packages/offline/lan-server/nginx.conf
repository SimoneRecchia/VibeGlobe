# VibeGlobe LAN server (F550): /            the site (a playground or application build, with its engine assets)
#                               /packages/  offline packages: manifests, PMTiles and MBTiles files
#                               /tiles/     static tile folders ({z}/{x}/{y}.png and the like)
# Every answer allows cross-origin reads (the engine may run on another origin); files answer HTTP range requests
# (PMTiles), carry ETags and validators, and the cache headers tell the engine how long to reuse them.
types {
  application/vnd.pmtiles pmtiles;
  application/vnd.sqlite3 mbtiles;
  image/ktx2 ktx2;
  application/x-protobuf pbf mvt;
  application/vnd.quantized-mesh terrain;
}

server {
  listen 8080;
  server_name _;
  root /srv/site;
  charset utf-8;
  etag on;
  # A health check of the engine must never be answered by a redirect or an HTML page (F297): no index listings.
  autoindex off;
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
  add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag, Last-Modified" always;
  add_header Accept-Ranges bytes always;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin * always;
  }

  location /assets/ {
    # Bundled files carry their hash in their name.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin * always;
  }

  location /packages/ {
    root /srv;
    if ($request_method = OPTIONS) { return 204; }
    # Packages change only by version; the engine revalidates them with their ETag.
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag, Last-Modified" always;
    add_header Accept-Ranges bytes always;
  }

  location /tiles/ {
    root /srv;
    if ($request_method = OPTIONS) { return 204; }
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag, Last-Modified" always;
    # A missing tile is a plain 404, which the engine reads as no data.
    error_page 404 = @missing;
  }

  location @missing {
    add_header Access-Control-Allow-Origin * always;
    default_type text/plain;
    return 404 "no tile\n";
  }
}
