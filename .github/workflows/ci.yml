name: CI

# Saves minutes (ADR 0015): every push, and pull requests from forks, run one job with every fast check; pushes to
# main, the nightly schedule and manual runs add the browser jobs (end-to-end tests and recorded benchmarks).
on:
  push:
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks
    # A pull request from this repository is already checked by the push of its head commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Repository checks
        run: npm run check
      - name: Dead code
        run: npm run deadcode
      - name: Feature list and test guards against the previous state
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD)
          fi
          npm run check:features -- --base "$base"
          npm run check:tests -- --base "$base"
      - name: Unit tests with coverage
        run: npm run coverage
      - name: License audit
        run: npm run licenses
      - name: Third-party notices up to date
        run: npm run notices -- --check
      - name: API documentation
        run: npm run docs
      - name: Build
        run: npm run build
      - name: Consumer check
        run: npm run check:consumer
      - name: Bundle size
        run: npm run size
      - name: Tree shaking
        run: npm run treeshake

  e2e:
    name: End-to-end tests (Chromium)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Geodesics against Karney's GeodTest data set (downloaded; F076)
        run: npm run geodtest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  benchmarks:
    name: Benchmarks (recorded, not gated)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      VIBEGLOBE_DEVICE: ci-swiftshader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Timings on SwiftShader are not meaningful (ADR 0012): record them as a trend, gate only deterministic counters.
      - run: npm run bench -- --report-only
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/ci-swiftshader/
