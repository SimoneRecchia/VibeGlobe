name: Visual baselines

# Records the visual-test baselines in the pinned environment (ADR 0012): Playwright's own Chromium on a GitHub-hosted
# runner, the same setup as the CI end-to-end job. Run it manually on a branch after an intended visual change; it
# commits the new baselines to that branch. A push that changes e2e/__baselines__/request.md (the reason for new
# baselines) also starts it, so it works on branches before the workflow reaches the default branch. Procedure:
# docs/guides/visual-tests.md.
on:
  workflow_dispatch:
  push:
    paths: ['e2e/__baselines__/request.md']

permissions:
  contents: write

jobs:
  baselines:
    name: Record visual baselines
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        # Full history, so the baseline commit can be rebased onto commits pushed while the job ran.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts --update-snapshots=all
      # The ui package's controls in the light and dark themes (F430).
      - run: npx playwright test e2e/ui-theme.spec.ts --project=chromium --grep F430 --update-snapshots=all
      # Traces of failed views (recorded on the retry, ADR 0012), to investigate a capture that never completes.
      - name: Upload the failed views' traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-test-results
          path: test-results/
          retention-days: 7
      - name: Commit the baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__baselines__
          if git diff --cached --quiet; then
            echo 'Baselines unchanged.'
          else
            git commit -m 'Record visual baselines in the pinned CI environment'
            # The branch may have moved while the suite ran: the commit adds only baselines, so it rebases cleanly.
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
              sleep 5
            done
            exit 1
          fi
