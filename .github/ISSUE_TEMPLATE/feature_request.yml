name: Feature request
description: Propose a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current engine does not allow it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior or API you suggest, and the alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related sections of PLAN.md, map sources, platforms or frameworks involved.
