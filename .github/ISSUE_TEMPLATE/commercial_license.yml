name: Commercial license inquiry
description: Ask for a commercial license. Keep confidential details for the private follow-up.
labels: [commercial-license]
body:
  - type: markdown
    attributes:
      value: VibeGlobe is free for noncommercial use under the PolyForm Noncommercial License 1.0.0; any commercial use, resale included, needs a commercial license from the owner. This issue is public, so share only what you are comfortable publishing; the owner answers privately.
  - type: input
    id: organization
    attributes:
      label: Organization
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: The product or service that would use VibeGlobe, in a sentence or two.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: How to reach you privately
      description: For example a GitHub handle or a business contact page.
    validations:
      required: true
