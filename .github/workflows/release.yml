name: Release

# ADR 0190. Started by hand on main with the version to publish: builds the engine, packs `vibeglobe` at that version
# and publishes it to the public npm registry with the NPM_TOKEN secret of the `npm-release` environment, whose
# required reviewers, when set, approve the job first. Nothing else: no changelog, commit or tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (semantic version; a pre-release such as 1.0.0-rc.1 goes to the "next" dist-tag)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - name: Build, pack and publish vibeglobe
        run: node scripts/release/release.ts "$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
