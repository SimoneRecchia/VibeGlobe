name: Release

# ADR 0190, ADR 0191. Started by hand on main with the version to publish: builds the engine, packs `vibeglobe` at that
# version and publishes it to the public npm registry through npm's trusted publishing: GitHub's OIDC identity of this
# workflow, no token, provenance attached by npm. The `npm-release` environment's required reviewers, when set, approve
# the job first. Nothing else: no changelog, commit or tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (semantic version; a pre-release such as 1.0.0-rc.1 goes to the "next" dist-tag)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      # No dependency cache in a release build (npm's trusted publishing guide).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - name: Build, pack and publish vibeglobe
        run: node scripts/release/release.ts "$VERSION"
