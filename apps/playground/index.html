<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>VibeGlobe playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #0b1020;
        color: #e8ecf5;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #globe {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Bottom center: the credits take the bottom right corner (pinned in the top layer). */
      #cursor {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        /* Readouts only: wheel and drag input at the corners reaches the globe (F155). */
        pointer-events: none;
      }
      /* The 2D / 3D / Auto toggle (F163). */
      #view-modes {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 2px;
      }
      /* The camera commands (M6): tilt, orientation, reset to the globe and home. */
      #camera-controls {
        position: absolute;
        top: 40px;
        right: 8px;
        display: flex;
        gap: 2px;
        align-items: center;
      }
      #camera-controls button {
        font: inherit;
        font-size: 12px;
        padding: 3px 6px;
        border: 1px solid #5a6680;
        background: #1b2236;
        color: #e8ecf5;
        cursor: pointer;
      }
      #camera-controls input {
        width: 80px;
      }
      /* The navigation mode (F620), above the status line: clear of the corners the wheel tests use. */
      #navigation-mode {
        position: absolute;
        bottom: 30px;
        left: 8px;
        font-size: 12px;
      }
      /* A ui layer brings its own controls to that corner (M12): the playground's toggles step aside. */
      #app:has(.vg-ui) #camera-controls,
      #app:has(.vg-ui) #navigation-mode,
      #app:has(.vg-ui) #view-modes {
        display: none;
      }
      #view-modes button {
        font: inherit;
        font-size: 13px;
        padding: 4px 10px;
        border: 1px solid #5a6680;
        background: #1b2236;
        color: #e8ecf5;
        cursor: pointer;
      }
      #view-modes button[aria-pressed='true'] {
        background: #3d6ef0;
        border-color: #3d6ef0;
      }
      #status {
        position: absolute;
        bottom: 8px;
        left: 8px;
        margin: 0;
        font-size: 13px;
        pointer-events: none;
      }
      /* Debug tile view (F116) and performance HUD (F119). */
      .tile-view {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .tile-view svg {
        position: absolute;
        inset: 0;
      }
      .tile-view path {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
      }
      .tile-view path.ancestor {
        stroke: #ff9800;
        stroke-dasharray: 4 3;
      }
      .tile-view span {
        position: absolute;
        left: 0;
        top: 0;
        font: 10px monospace;
        color: #fff;
        text-shadow: 0 0 2px #000;
        white-space: nowrap;
      }
      .tile-view span.ancestor {
        color: #ffb74d;
      }
      /* Above the status line, which takes the bottom left corner. */
      .tile-view-toggle {
        position: absolute;
        left: 8px;
        bottom: 30px;
        font: 12px sans-serif;
        color: #fff;
      }
      .vibeglobe-hud {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 4px 8px;
        font: 11px monospace;
        color: #fff;
        background: rgb(0 0 0 / 60%);
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="globe" aria-label="Map"></canvas>
      <p id="status">Loading…</p>
      <p id="cursor" aria-live="off"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- `?stars=1`: the space background (ADR 0181), src/space-background.ts; nothing loads without the parameter. -->
    <script type="module" src="/src/space-background.ts"></script>
  </body>
</html>
